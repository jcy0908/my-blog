<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>2048 게임 - My Blog</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="./game.css">
<script>
(function () {
  try {
    var theme = localStorage.getItem('theme');
    if (theme === 'dark' || theme === 'light') {
      document.documentElement.dataset.theme = theme;
    }
  } catch (e) {}
})();
</script>
</head>
<body>
<header class="site-header">
  <a class="site-title" href="../index.html">My Blog</a>
  <div class="site-header-actions">
    <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">
      <svg class="theme-toggle-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
      <span class="visually-hidden">테마 전환</span>
    </button>
  </div>
</header>
<main>
  <h1>2048</h1>
  <p class="game-desc">방향키(←↑→↓) 또는 화면을 스와이프해서 같은 숫자 타일을 합쳐보세요. 타일 하나가 2048이 되면 승리예요.</p>

  <div class="game-wrap">
    <div class="game-header">
      <div class="score-box">
        <span class="score-label">SCORE</span>
        <span id="score">0</span>
      </div>
      <div class="score-box">
        <span class="score-label">BEST</span>
        <span id="best">0</span>
      </div>
      <button id="new-game" class="new-game-btn" type="button">새 게임</button>
    </div>

    <div class="board-wrap">
      <div id="board" class="board" role="grid" aria-label="2048 게임판">
        <div class="board-cells" id="board-cells"></div>
        <div class="board-tiles" id="board-tiles"></div>
      </div>
      <div id="overlay" class="game-overlay" hidden>
        <p id="overlay-message"></p>
        <div class="overlay-actions">
          <button id="overlay-continue" class="new-game-btn" type="button" hidden>계속하기</button>
          <button id="overlay-restart" class="new-game-btn" type="button">새 게임</button>
        </div>
      </div>
    </div>
  </div>
</main>
<footer class="site-footer">
  <p><a href="../index.html">← 블로그로</a></p>
</footer>
<script type="module" src="../theme.js"></script>
<script type="module" src="./game.js"></script>
</body>
</html>
