<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>2048 — My Blog</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="./style.css">
<script>
(function () {
  try {
    var theme = localStorage.getItem('theme');
    if (theme === 'dark' || theme === 'light') {
      document.documentElement.dataset.theme = theme;
    }
  } catch (e) {}
})();
</script>
</head>
<body>
<header class="site-header">
  <a class="site-title" href="../../index.html">My Blog</a>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">
    <svg class="theme-toggle-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
    <span class="visually-hidden">테마 전환</span>
  </button>
</header>
<main class="game-main">
  <h1>2048</h1>
  <p class="game-desc">화살표 키 또는 화면을 스와이프해서 같은 숫자 타일을 합쳐보세요.</p>

  <div class="game-scoreboard">
    <div class="score-box">
      <span class="score-label">점수</span>
      <span id="score" class="score-value">0</span>
    </div>
    <div class="score-box">
      <span class="score-label">최고 점수</span>
      <span id="best-score" class="score-value">0</span>
    </div>
    <button id="new-game" class="new-game-btn" type="button">새 게임</button>
  </div>

  <div id="board" class="board" role="group" aria-label="2048 게임판">
    <div class="board-grid">
      <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
      <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
      <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
      <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
    </div>
    <div id="tile-layer" class="tile-layer"></div>
    <div id="game-overlay" class="game-overlay" hidden>
      <p id="game-overlay-text"></p>
      <button id="overlay-retry" class="new-game-btn" type="button">다시 시작</button>
    </div>
  </div>
</main>
<footer class="site-footer">
  <p>&copy; 2026 My Blog</p>
</footer>
<script type="module" src="../../theme.js"></script>
<script type="module" src="./game.js"></script>
</body>
</html>
