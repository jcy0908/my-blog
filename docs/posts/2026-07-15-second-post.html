<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>두 번째 포스트</title>
<link rel="stylesheet" href="../styles.css">
<script>
(function () {
  try {
    var theme = localStorage.getItem('theme');
    if (theme === 'dark' || theme === 'light') {
      document.documentElement.dataset.theme = theme;
    }
  } catch (e) {}
})();
</script>
</head>
<body>
<header class="site-header">
  <a class="site-title" href="../index.html">My Blog</a>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">
    <svg class="theme-toggle-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
    <span class="visually-hidden">테마 전환</span>
  </button>
</header>
<main>
<article>
  <header class="post-header">
    <h1>두 번째 포스트</h1>
    <p class="post-meta">
      <time datetime="2026-07-15">2026년 7월 15일</time>
      <ul class="tag-list"><li class="tag">잡담</li></ul>
    </p>
  </header>
  <div class="post-content">
<p>정렬 순서를 확인하기 위한 짧은 두 번째 글입니다.</p>
<p>이 글은 첫 번째 포스트보다 날짜가 이르므로 목록에서 아래쪽에 나와야 합니다.</p>
  </div>
</article>
<p class="post-nav"><a href="../index.html">← 목록으로</a></p>
</main>
<footer class="site-footer">
  <p>&copy; 2026 My Blog</p>
</footer>
<script type="module" src="../theme.js"></script>
</body>
</html>
