<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>2048</title>
<link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1 class="title">2048</h1>
      <div class="header-actions">
        <div class="scoreboard">
          <div class="score-box">
            <span class="score-label">SCORE</span>
            <span class="score-value" id="score">0</span>
            <span class="score-delta" id="score-delta" aria-hidden="true"></span>
          </div>
          <div class="score-box">
            <span class="score-label">BEST</span>
            <span class="score-value" id="best-score">0</span>
          </div>
        </div>
        <button type="button" class="icon-button" id="theme-toggle" aria-label="다크 모드 전환" title="다크 모드 전환">
          <span class="theme-icon" aria-hidden="true">🌙</span>
        </button>
      </div>
    </header>

    <div class="controls-row">
      <p class="hint">방향키 또는 화면 스와이프로 타일을 밀어 합치세요. 같은 숫자 두 개를 합치면 2048을 만들 수 있어요.</p>
      <button type="button" class="new-game-button" id="new-game">새 게임</button>
    </div>

    <main class="board-wrapper">
      <div class="board" id="board" aria-label="2048 게임 보드">
        <div class="board-grid" id="board-grid"></div>
        <div class="tiles-layer" id="tiles-layer"></div>

        <div class="overlay" id="overlay" hidden>
          <div class="overlay-content">
            <p class="overlay-message" id="overlay-message"></p>
            <div class="overlay-actions">
              <button type="button" class="overlay-button" id="overlay-continue" hidden>계속하기</button>
              <button type="button" class="overlay-button primary" id="overlay-restart">새 게임</button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="app-footer">
      <p>키보드 방향키(↑ ↓ ← →) 또는 터치 스와이프로 조작합니다.</p>
    </footer>
  </div>

  <script type="module" src="./script.js"></script>
</body>
</html>
